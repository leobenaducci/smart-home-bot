<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{{ strings.title }}</title>
  <link rel="stylesheet" href="/static/vendor/fonts/house.css">
  <style>
    /* The house tokens (menu.html has the long explanation of each). */
    :root {
      --plaster:#EFE9DC; --paper:#FBF8F1; --paper-2:#fff;
      --ink:#2B2721; --ink-soft:#6E665A;
      --wall:#3C4630; --wall-fg:#DAD4C2;
      --olive:#57633F; --olive-2:#7E8A61;
      --honey:#C6892B; --honey-lt:#EBD49B; --clay:#AC4B36; --line:#E3DACA;
      --display: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      --r-lg: 16px; --r: 10px; --r-sm: 8px; --r-pill: 999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: var(--plaster); font-family: var(--sans); color: var(--ink);
           -webkit-font-smoothing: antialiased; }
    header { background: var(--wall); color: var(--wall-fg); padding: 14px 20px; display: flex; align-items: center; gap: 13px; }
    header .plate { width: 40px; height: 40px; flex: none; display: grid; place-items: center;
      background: linear-gradient(160deg, rgba(255,255,255,.15), rgba(0,0,0,.17));
      border: 1px solid rgba(235,212,155,.25); border-radius: 12px; font-size: 1.3rem; }
    header h1 { font-family: var(--display); font-size: 1.15rem; font-weight: 700; color: #F3EEDF; }
    header .hlink { margin-left: auto; color: var(--wall-fg); text-decoration: none; font-size: .8rem; font-weight: 600;
      padding: 7px 11px; border-radius: 10px; border: 1px solid rgba(218,212,194,.16); }
    main { max-width: 980px; margin: 18px auto 120px; padding: 0 16px; }
    h2 { font-family: var(--display); font-size: 1.2rem; margin: 6px 0 12px; }
    .muted { color: var(--ink-soft); font-size: .8rem; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; }
    button, .btn { font: inherit; font-size: .82rem; font-weight: 700; border-radius: var(--r); cursor: pointer;
      border: 1px solid var(--line); background: var(--paper-2); color: var(--olive); padding: 8px 12px;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    button:hover, .btn:hover { border-color: var(--honey); color: var(--honey); }
    button.primary { background: var(--olive); color: #fff; border-color: var(--olive); }
    button.primary:hover { background: var(--honey); border-color: var(--honey); color: #fff; }
    button.danger { color: var(--clay); }
    button:disabled { opacity: .5; cursor: default; }
    input, select, textarea { font: inherit; font-size: .88rem; color: var(--ink); background: var(--paper);
      border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; width: 100%; }
    textarea { resize: vertical; min-height: 64px; }
    label.f { display: block; font-size: .8rem; font-weight: 700; color: var(--olive); text-transform: none;
      letter-spacing: 0; margin: 12px 0 5px; }
    .card { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; margin-bottom: 12px; }
    .pill { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px;
      border-radius: var(--r-pill); background: rgba(126,138,97,.14); color: var(--olive); white-space: nowrap; }
    .pill.run { background: rgba(198,137,43,.18); color: #8A5E17; }
    .pill.bad { background: rgba(172,75,54,.14); color: var(--clay); }
    .pill.ok { background: rgba(87,99,63,.16); color: var(--olive); }

    /* The card's state, always in view. */
    #gpu { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line);
      padding: 8px 20px; display: flex; gap: 10px; align-items: center; font-size: .82rem; cursor: pointer; }
    #gpu .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--olive-2); flex: none; }
    #gpu.busy .dot { background: var(--honey); animation: pulse 1.4s ease-in-out infinite; }
    #gpu.paused .dot { background: var(--clay); }
    #gpu .bar { flex: 1; max-width: 220px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    #gpu .bar i { display: block; height: 100%; background: var(--honey); width: 0; transition: width .6s; }
    @keyframes pulse { 50% { opacity: .35 } }
    @media (prefers-reduced-motion: reduce) { #gpu.busy .dot { animation: none; } }

    /* Queue drawer */
    #queue { display: none; background: var(--paper-2); border-bottom: 1px solid var(--line); padding: 12px 20px; }
    #queue.open { display: block; }
    .qrow { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: .84rem; }
    .qrow:first-child { border-top: 0; }
    .qrow .pos { font-family: var(--mono); color: var(--ink-soft); width: 32px; }
    .qrow.mine { font-weight: 700; }

    /* Projects */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .pcard { background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; cursor: pointer; }
    .pcard:hover { border-color: var(--honey); }
    .pcard .cover { aspect-ratio: 16/9; background: var(--wall) center/cover no-repeat; display: grid; place-items: center; font-size: 2rem; }
    .pcard .body { padding: 10px 12px; }
    .pcard .name { font-weight: 800; }
    .pcard.new .cover { background: var(--paper); color: var(--olive); }

    /* Editor: the title, where the project is in its making, and its tabs. */
    .ed-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    #pname { flex: 1 1 240px; width: auto; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.45rem;
      background: transparent; border: 1px solid transparent; padding: 4px 8px; color: var(--ink); }
    #pname:hover { border-color: var(--line); }
    #pname:focus { border-color: var(--honey); outline: none; background: var(--paper); }
    .ed-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
    details.more { position: relative; }
    details.more > summary { list-style: none; cursor: pointer; font-size: .82rem; font-weight: 700; color: var(--olive);
      border: 1px solid var(--line); background: var(--paper-2); border-radius: var(--r); padding: 8px 12px; }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more > summary:focus-visible, .rail button:focus-visible, .tabs button:focus-visible {
      outline: 2px solid var(--honey); outline-offset: 2px; }
    details.more .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 6; display: grid; gap: 4px; min-width: 170px;
      background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.28); }
    details.more .menu button { justify-content: flex-start; }

    /* The production rail: the stages of a film in their order, each saying
       how far along it is. It is the page's one loud element; the rest stays
       quiet around it. */
    .rail { display: grid; grid-template-columns: repeat(var(--steps), minmax(0, 1fr)); margin: 0 0 12px;
      background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
    .rail button { background: transparent; border: 0; border-right: 1px solid var(--line); border-radius: 0 !important;
      padding: 11px 14px 12px; display: grid; gap: 3px; justify-items: start; text-align: left; color: var(--ink); font-weight: 400; }
    .rail button:last-child { border-right: 0; }
    .rail button:hover { background: var(--tint, rgba(126,138,97,.06)); color: var(--ink); border-color: var(--line); }
    .rail .step { font-family: var(--display); font-size: 1.02rem; font-weight: 700; }
    .rail .step i { font-style: normal; font-family: var(--sans); font-size: .74rem; font-weight: 700; color: var(--ink-soft);
      margin-right: 6px; opacity: .8; }
    .rail .st { font-size: .76rem; line-height: 1.35; color: var(--ink-soft); }
    .rail .st b { font-weight: 700; color: var(--honey); }
    .rail button.done .step::after { content: " ✓"; color: var(--olive); font-family: var(--sans); font-size: .9rem; }
    .rail button.on { box-shadow: inset 0 -3px 0 var(--honey); }

    .tabs { display: flex; gap: 2px; overflow-x: auto; margin: 0 0 14px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 0 !important;
      padding: 10px 12px 9px; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
    .tabs button:hover { color: var(--ink); border-color: transparent; border-bottom-color: var(--line); }
    .tabs button.on { background: transparent; color: var(--ink); border-bottom-color: var(--honey); }
    @media (max-width: 640px) {
      .rail { grid-template-columns: repeat(var(--steps), minmax(150px, 1fr)); overflow-x: auto; }
      .rail .step { font-size: .95rem; }
      .ed-actions { order: 1; }
      #pname { font-size: 1.25rem; flex-basis: 100%; order: 2; padding-left: 0; }
      #saved { order: 3; }
    }
    .shot { display: grid; grid-template-columns: minmax(220px, 360px) 1fr; gap: 14px; }
    @media (max-width: 720px) { .shot { grid-template-columns: 1fr; } }
    .media { background: #1d1f18; border-radius: var(--r); overflow: hidden; aspect-ratio: 16/9; display: grid; place-items: center; color: #aaa; font-size: .8rem; }
    .media video, .media img { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
    .takes { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
    .takes button { padding: 3px 8px; font-size: .72rem; }
    .takes button.on { background: var(--olive); color: #fff; }
    .link { text-align: center; color: var(--olive-2); font-size: .72rem; margin: -6px 0 6px; }
    .timeline { display: flex; gap: 3px; overflow-x: auto; padding: 8px 0; }
    .timeline div { flex: none; height: 38px; border-radius: 6px; background: var(--line) center/cover; border: 2px solid transparent;
      font-size: .66rem; color: #fff; display: grid; place-items: center; text-shadow: 0 1px 2px #000; cursor: pointer; }
    .timeline div.made { background-color: var(--olive-2); }
    .timeline div.job { border-color: var(--honey); }
    audio { width: 100%; margin-top: 6px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
    .gallery img { width: 100%; border-radius: var(--r-sm); cursor: zoom-in; display: block; }
    .note { background: rgba(198,137,43,.12); border-radius: var(--r); padding: 8px 12px; font-size: .82rem; margin: 8px 0; }
    .err { background: rgba(172,75,54,.12); color: var(--clay); }
    footer { text-align: center; font-size: .72rem; color: var(--ink-soft); margin: 30px 0; }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--wall); color: #fff;
      padding: 10px 16px; border-radius: var(--r); font-size: .84rem; display: none; z-index: 20; max-width: 92vw; }
    /* The theme's own card colours. A <dialog> takes the browser's white and
       black otherwise, which on a dark household theme put the theme's pale
       text on white: help lines and estimates that could not be read. */
    /* `margin: auto` is what centres a modal <dialog>, and the reset at the
       top of this sheet (`* { margin: 0 }`) took it away: every dialog opened
       in the top-left corner. Tall ones scroll inside rather than off-screen. */
    dialog { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; max-width: 520px; width: 92vw;
             background: var(--paper-2); color: var(--ink); margin: auto; max-height: 90vh; overflow: auto; }
    dialog.wide { max-width: 900px; }
    dialog h2 { color: var(--ink); }
    dialog p.muted { font-size: .86rem; line-height: 1.45; }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    img.board { width: 100%; border-radius: var(--r-sm); display: block; }
    /* Storyboard: a toolbar, one quiet line of help, then the frames. */
    .sb-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .sb-note { font-size: .8rem; line-height: 1.45; color: var(--ink-soft); margin: 8px 0 14px; max-width: 78ch; }
    .sb-correct { margin-top: 12px; max-width: 78ch; }
    .sb-correct textarea { width: 100%; box-sizing: border-box; font: inherit; }
    .sb-correct-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 6px; }
    .sb-correct-row label { font-size: .85rem; color: var(--ink-soft); }
    .sb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
    .sb-card { padding: 10px; }
    .sb-frame { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-sm); background: var(--line); display: flex;
                align-items: center; justify-content: center; overflow: hidden; }
    .sb-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* What is on the frame is shown on the frame: its time on the song, its
       score, whether its video was made before it. */
    .sb-tc, .sb-score, .sb-flag { position: absolute; font-size: .72rem; line-height: 1; padding: 4px 7px; border-radius: 4px;
      background: rgba(0,0,0,.62); color: #fff; }
    .sb-tc { left: 8px; bottom: 8px; font-family: var(--mono); letter-spacing: .01em; }
    .sb-score { right: 8px; top: 8px; font-weight: 800; font-size: .78rem; }
    .sb-score.good { background: var(--olive); color: var(--paper); }
    .sb-score.weak { background: var(--clay); color: #fff; }
    .sb-flag { left: 8px; top: 8px; font-weight: 700; }
    .sb-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
    .sb-title b { font-family: var(--display); font-size: 1.02rem; }
    .sb-sung { font-style: italic; font-size: .8rem; line-height: 1.4; color: var(--ink-soft); margin: 0 0 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sb-card textarea { min-height: 96px; font-size: .84rem; line-height: 1.45; }
    .review { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    .review summary { cursor: pointer; font-size: .8rem; color: var(--ink-soft); padding: 2px 0; }
    .review summary b { color: var(--ink); }
    .rv-line { font-size: .8rem; line-height: 1.4; margin-top: 3px; }
    .rv-fix { margin-top: 6px; padding: 8px 10px; border-radius: var(--r-sm); background: color-mix(in srgb, var(--honey) 12%, transparent);
      font-size: .8rem; line-height: 1.45; }
    /* The redraw it suggests is a paragraph; three lines of it say what it
       is about, and a tap opens the rest. */
    .rv-fix label { display: block; margin-bottom: 4px; }
    .rv-fix textarea { min-height: 84px; font-size: .8rem; line-height: 1.45; background: var(--paper); }
    .hist-body { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
    .hist-change { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .86rem; line-height: 1.45; }
    .hist-change ins { background: rgba(126,138,97,.25); text-decoration: none; }
    .hist-change del { background: rgba(172,75,54,.18); }
    img.live { width: 100%; border-radius: var(--r-sm); display: block; background: #000; }
    dialog label.choice { display: flex; gap: 8px; align-items: center; padding: 6px 0; cursor: pointer; }
  </style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <header>
    <span class="plate">🎬</span>
    <h1>{{ strings.title }}</h1>
    <a href="/chat" class="hlink">🤵 Alfred</a>
  </header>

  {% if not configured %}
  <main><div class="card">{{ strings.not_configured }}</div></main>
  {% else %}
  <div id="gpu" role="button" aria-expanded="false" aria-controls="queue">
    <span class="dot"></span><span id="gpu-text">…</span><span class="bar"><i></i></span>
    <span class="grow"></span><span class="muted" id="gpu-count"></span>
  </div>
  <section id="queue" aria-live="polite"></section>

  <main>
    <section id="v-list">
      <h2>{{ strings.projects }}</h2>
      <div class="grid" id="plist"></div>
    </section>
    <section id="v-edit" hidden></section>
    <footer>{{ strings.made_with }}</footer>
  </main>
  <div id="toast" role="status"></div>
  <dialog id="dlg"></dialog>
  {% endif %}

  {# Always emitted, so test_templates_parse.py checks it; it does nothing on
     a page without the studio's markup. #}
  <script>
  (function () {
    'use strict';
    if (!document.getElementById('gpu')) return;
    var S = {{ strings | tojson }};
    var IS_ADMIN = {{ 'true' if is_admin else 'false' }};
    var ME = {{ user|tojson }};
    var CSRF = document.querySelector('meta[name=csrf-token]').content;
    var $ = function (sel, root) { return (root || document).querySelector(sel); };
    // Quotes too: this goes inside value="..." and title="..." all over the
    // page, and a title with a quote in it was cut at the quote.
    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s);
      return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function fmt(key, vars) { return (S[key] || key).replace(/\{(\w+)\}/g, function (_, k) { return vars[k]; }); }
    function dur(s) {
      s = Math.max(0, Math.round(s || 0));
      if (s < 60) return s + ' ' + S.sec;
      if (s < 3600) return Math.round(s / 60) + ' ' + S.min;
      return (s / 3600).toFixed(1) + ' ' + S.hours;
    }
    function toast(text, bad) {
      var t = $('#toast'); t.textContent = text; t.style.background = bad ? 'var(--clay)' : 'var(--wall)';
      t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 5000);
    }
    async function api(path, opts) {
      opts = opts || {};
      var init = { method: opts.method || 'GET', headers: {} };
      if (opts.body !== undefined) {
        if (opts.body instanceof FormData) init.body = opts.body;
        else { init.body = JSON.stringify(opts.body); init.headers['Content-Type'] = 'application/json'; }
      }
      if (init.method !== 'GET') init.headers['X-CSRF-Token'] = CSRF;
      var r = await fetch('/studio/api/' + path, init);
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.detail || d.error || ('HTTP ' + r.status));
      return d;
    }
    function fileUrl(pid, rel) { return '/studio/api/projects/' + pid + '/file/' + rel.split('/').map(encodeURIComponent).join('/'); }
    // A download, not a link: `?download=` has the portal send the file as an
    // attachment under this name, which is what makes the Android app hand it
    // to the phone's downloads (the `download` attribute alone does nothing
    // in a WebView). The extension is the file's own; the portal adds it.
    function dlLink(pid, rel, name) {
      var ext = (rel.match(/\.[A-Za-z0-9]+$/) || [''])[0];
      return '<a class="btn" download data-save="' + esc(name + ext) + '" href="' + fileUrl(pid, rel) + '?download=' + encodeURIComponent(name) + '">⬇ ' + S.download + '</a>';
    }
    // In a browser the page fetches the file itself and saves it. Handing
    // the link to the browser's download manager failed on the portal's own
    // certificate: the person accepted it for the page, the download manager
    // makes a request of its own and refuses it, and Chrome says "check
    // internet connection" (2026-09-28). The Android app is the exception --
    // its WebView cannot save a blob, and it hands an attachment to the
    // phone's downloads -- so there the link is followed as it is.
    var IN_APP = /\bwv\b/.test(navigator.userAgent) || !!window.AndroidDeviceKey;
    async function saveFile(url, name) {
      if (IN_APP) { location.href = url; return; }
      var r = await fetch(url, { credentials: 'same-origin' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var blob = await r.blob(), link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = name;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 60000);
    }
    document.addEventListener('click', function (ev) {
      var a = ev.target.closest && ev.target.closest('a[data-save]');
      if (!a || IN_APP) return;
      ev.preventDefault();
      var label = a.innerHTML; a.textContent = '…';
      saveFile(a.href, a.dataset.save).catch(function (e) { toast(fmt('err', { e: e.message }), true); })
        .finally(function () { a.innerHTML = label; });
    });

    // ── The card and the queue ───────────────────────────────────────────
    var queueState = null;
    async function loadQueue() {
      if (document.hidden) return;
      try { queueState = await api('queue'); } catch (e) { $('#gpu-text').textContent = S.unreachable; return; }
      var q = queueState, run = q.running, g = $('#gpu');
      g.classList.toggle('busy', !!run); g.classList.toggle('paused', !!q.status.paused);
      // Paused means the next job waits, not that the one on the card stops:
      // say both when both are true, and why, so a shot still moving does
      // not sit under a word that says it is not.
      var why = q.status.pause_reason === 'update' ? S.card_paused_update
        : q.status.pause_reason === 'programmer' ? S.card_paused_programmer : S.card_paused;
      $('#gpu-text').textContent = q.status.paused && run
        ? fmt('card_busy', { what: run.what, who: run.mine ? S.yours : run.owner_name, pct: Math.round(run.progress * 100) }) +
          ' · ' + fmt('card_paused_after', { why: why })
        : q.status.paused ? why : run
        ? fmt('card_busy', { what: run.what, who: run.mine ? S.yours : run.owner_name, pct: Math.round(run.progress * 100) })
        // Something outside the Studio holds the card (the Programmer's model):
        // the next job waits for it rather than failing for lack of memory.
        : q.status.card_busy_mb ? fmt('card_taken', { gb: (q.status.card_busy_mb / 1024).toFixed(1) })
        : S.card_free;
      if (!run && q.status.card_busy_mb) g.classList.add('paused');
      $('#gpu .bar i').style.width = run ? Math.round(run.progress * 100) + '%' : '0';

    // Storyboard: a frame per shot, looked at and changed before any video

    // The project's words under version control (the Studio's history.py):
    // every save a revision, by who made it; undo one change, go back to a
    // revision, or tag one. Pictures, clips and songs are not in it.
    function wordDiff(a, b) {
      var x = String(a == null ? '' : a).split(/(\s+)/), y = String(b == null ? '' : b).split(/(\s+)/);
      if (x.length * y.length > 250000) return '<del>' + esc(a) + '</del> <ins>' + esc(b) + '</ins>';
      var m = x.length, n = y.length, L = [];
      for (var i = 0; i <= m; i++) { L.push(new Array(n + 1).fill(0)); }
      for (i = m - 1; i >= 0; i--) for (var j = n - 1; j >= 0; j--)
        L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
      var out = '', k = 0, l = 0;
      while (k < m && l < n) {
        if (x[k] === y[l]) { out += esc(x[k]); k++; l++; }
        else if (L[k + 1][l] >= L[k][l + 1]) { out += '<del>' + esc(x[k]) + '</del>'; k++; }
        else { out += '<ins>' + esc(y[l]) + '</ins>'; l++; }
      }
      while (k < m) out += '<del>' + esc(x[k++]) + '</del>';
      while (l < n) out += '<ins>' + esc(y[l++]) + '</ins>';
      return out;
    }
    function histValue(v, field) {
      if (v == null || v === '') return '<span class="muted">—</span>';
      if (field === 'cast' && Array.isArray(v)) {
        return esc(v.map(function (id) { var c = cast.find(function (x) { return x.id === id; }); return c ? c.name : '?'; }).join(', '));
      }
      if (typeof v === 'object') return '<code>' + esc(JSON.stringify(v)) + '</code>';
      return esc(String(v));
    }
    function histChanges(list) {
      if (!list.length) return '<p class="muted">' + S.hist_nothing + '</p>';
      return list.map(function (c) {
        var head = '<b>' + esc(c.label) + '</b> · ' + esc(c.field_label || '');
        var body;
        if (c.change === 'added' || c.change === 'removed') {
          var rec = c.after || c.before || {};
          body = esc(rec.prompt || rec.lyrics || rec.title || rec.look || rec.name || '');
        } else if (c.on === 'order') {
          body = '<span class="muted">' + S.hist_reordered + '</span>';
        } else if (typeof c.before === 'string' && typeof c.after === 'string') {
          body = wordDiff(c.before, c.after);
        } else {
          body = histValue(c.before, c.field) + ' → ' + histValue(c.after, c.field);
        }
        return '<div class="hist-change"><div class="muted">' + head + '</div><div>' + body + '</div></div>';
      }).join('');
    }

            '</div><div class="row" style="margin-top:4px"><span class="muted">' + esc(r.author) + ' · ' + new Date(r.at * 1000).toLocaleString() +
            ' · <code>' + r.rev.slice(0, 7) + '</code></span><span class="grow"></span>' +
            '<button data-hshow="' + r.rev + '">' + S.hist_show + '</button>' +
            (r.kind !== 'start' ? '<button data-hrevert="' + r.rev + '" title="' + esc(S.hist_revert_help) + '">↩ ' + S.hist_revert + '</button>' : '') +
            (i > 0 ? '<button data-hrestore="' + r.rev + '" title="' + esc(S.hist_restore_help) + '">⏪ ' + S.hist_restore + '</button>' : '') +
            '<button data-htag="' + r.rev + '">🏷</button></div><div class="hist-body" id="hb-' + r.rev + '" hidden></div></div>';
        }).join('') : '<p class="muted">' + S.hist_empty + '</p>';
        $('#hist-tag-now').disabled = !data.revisions.length;
      }
      async function after(res) {
        current = await api('projects/' + p.id); await loadCast(); drawEditor();
        toast(res.conflicts && res.conflicts.length ? fmt('hist_conflicts', { n: res.conflicts.length }) : S.hist_done, !!(res.conflicts && res.conflicts.length));
        load();
      }
      async function tagIt(rev) {
        var name = prompt(S.hist_tag_prompt); if (!name || !name.trim()) return;
        await api('projects/' + p.id + '/history/' + rev + '/tag', { method: 'POST', body: { name: name.trim() } });
        load();
      }
      dlg.onclick = async function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        var d = b.dataset;
        try {
          if (b.id === 'hist-tag-now' && data.revisions.length) return tagIt(data.revisions[0].rev);
          if (d.htag) return tagIt(d.htag);
          if (d.untag) { if (!confirm(S.hist_untag_confirm)) return; await api('projects/' + p.id + '/tags/' + d.untag, { method: 'DELETE' }); return load(); }
          if (d.hshow) {
            var box = $('#hb-' + d.hshow);
            if (!box.hidden) { box.hidden = true; return; }
            var sh = await api('projects/' + p.id + '/history/' + d.hshow);
            box.innerHTML = histChanges(sh.changes); box.hidden = false; return;
          }
          if (d.hrevert) {
            if (!confirm(S.hist_revert_confirm)) return;
            return after(await api('projects/' + p.id + '/history/' + d.hrevert + '/revert', { method: 'POST' }));
          }
          if (d.hrestore) {
            if (!confirm(S.hist_restore_confirm)) return;
            return after(await api('projects/' + p.id + '/history/' + d.hrestore + '/restore', { method: 'POST' }));
          }
        } catch (e) { toast(fmt('err', { e: e.message }), true); }
      };
      load();
    }

    // Files
    function filesTab() {
      var p = current, up = p.uploads || [];
      function list(kind) {
        var l = up.filter(function (u) { return u.kind === kind; });
        return l.length ? l.map(function (u) {
          var prev = kind === 'voice' ? '<audio controls preload="none" src="' + fileUrl(p.id, u.file) + '"></audio>' :
            '<img src="' + fileUrl(p.id, u.file) + '" style="max-width:120px;border-radius:6px">';
          var styleBtn = kind !== 'reference' ? '' :
            '<button data-style-ref="' + esc(u.file.replace(/^uploads\//, '')) + '" data-on="' + (u.style ? '0' : '1') + '"' +
            (u.style ? ' class="on"' : '') + ' title="' + esc(S.ref_style_help) + '">🎨 ' + S.ref_style + (u.style ? ' ✓' : '') + '</button>';
          return '<div class="row" style="margin:6px 0">' + prev + '<span class="muted grow">' + esc(u.name) + '</span>' + styleBtn +
            '<button class="danger" data-del-upload="' + esc(u.file.replace(/^uploads\//, '')) + '" title="' + esc(S.delete) + '">🗑</button></div>';
        }).join('') : '<p class="muted">' + S.no_files + '</p>';
      }
      return '<div class="card"><b>' + S.upload_ref + '</b><p class="muted">' + S.ref_style_intro + '</p>' + list('reference') +

        '<div class="row" style="margin-top:8px"><span class="muted">🎨 ' + S.upload_style + '</span>' +
        '<input type="file" accept="image/*" data-upload="reference" data-style="1" style="width:auto"></div></div>' +
        '<div class="card"><b>' + S.upload_voice + '</b><p class="muted">' + S.voice_sample_help + '</p>' + list('voice') +
        '<div class="row" style="margin-top:8px"><input type="file" accept="audio/*" data-upload="voice" style="width:auto"></div></div>';
    }

    // ── Editing and saving ────────────────────────────────────────────────
    function itemById(id) {
      var p = current;
      return (p.shots || []).find(function (s) { return s.id === id; }) || (p.audio || []).find(function (s) { return s.id === id; }) ||
             (p.images || []).find(function (s) { return s.id === id; });
    }
    function markDirty() {
      dirty = true; $('#saved').textContent = S.saving;
      clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 700);
    }
    async function flushSave() {
      clearTimeout(saveTimer);
      if (!dirty || !current) return;
      dirty = false; saving = true;
      var p = current;
      try {
        var saved = await api('projects/' + p.id, { method: 'PUT', body: { name: p.name, settings: p.settings, shots: p.shots, audio: p.audio, images: p.images } });
        ['shots', 'audio', 'images'].forEach(function (k) {       // ids the server gave new items
          saved[k].forEach(function (it, i) { if (p[k][i]) p[k][i].id = it.id; });
        });
        var el = $('#saved'); if (el) el.textContent = S.saved;
      } catch (e) { var el2 = $('#saved'); if (el2) el2.textContent = S.save_failed; toast(fmt('err', { e: e.message }), true); }
      finally { saving = false; }
    }
    async function saveNow() { dirty = true; await flushSave(); current = await api('projects/' + current.id); }

    document.addEventListener('input', function (ev) {
      var el = ev.target;
      if (!current) return;
      if (el.id === 'pname') { current.name = el.value; markDirty(); return; }
      if (el.id === 'sb-correct-text') { correctDraft = el.value; return; }
      if (el.id === 'sb-correct-redraw') { correctRedraw = el.checked; return; }
      if (el.dataset.theme) { themes[el.dataset.theme] = el.value; return; }
      if (!el.dataset.f) return;
      var item = itemById(el.dataset.id); if (!item) return;
      var v = el.type === 'checkbox' ? el.checked : el.type === 'range' || el.type === 'number' ? Number(el.value) : el.value;
      if (el.dataset.f === 'refs') v = el.value ? [el.value] : [];
      item[el.dataset.f] = v;
      if (el.type === 'range') el.previousElementSibling.querySelector('span').textContent = el.value;
      markDirty();
    });
    document.addEventListener('change', async function (ev) {
      var el = ev.target;
      if (!current) return;
      if (el.id === 'use-sb') { current.settings.use_storyboard = el.checked; markDirty(); drawTab(); return; }
      if (el.id === 'res' || el.id === 'lang') { current.settings[el.id === 'res' ? 'resolution' : 'language'] = el.value; markDirty(); return; }
      if (el.dataset.f === 'continuity') { drawTab(); return; }
      if (el.dataset.upload && el.files.length) {
        var fd = new FormData(); fd.append('file', el.files[0]); fd.append('kind', el.dataset.upload);
        if (el.dataset.style) fd.append('style', '1');
        toast(S.uploading);
        busy++;
        try {
          var up = await api('projects/' + current.id + '/upload', { method: 'POST', body: fd });
          if (up.style_error) toast(up.style_error, true);
          current = await api('projects/' + current.id); drawTab();
        }
        catch (e) { toast(fmt('err', { e: e.message }), true); }
        finally { busy--; }
      }
    });
    function newItem(fields) { return Object.assign({ id: 'new' + Math.random().toString(36).slice(2, 10), takes: [], chosen: -1 }, fields); }

    $('#v-edit').addEventListener('click', async function (ev) {
      var b = ev.target.closest('button, [data-jump]'); if (!b || !current) return;
      var p = current, d = b.dataset;
      try {
        if (b.id === 'back') return closeProject();
        if (d.tab) {
          await flushSave(); tab = d.tab; drawEditor();
          if (d.film) { var films = document.getElementById('renders') || document.getElementById('render'); if (films) films.scrollIntoView({ behavior: 'smooth' }); }
          return;
        }
        if (b.id === 'hist') { await flushSave(); return historyDialog(); }
        if (b.id === 'dup') { await flushSave(); var np = await api('projects/' + p.id + '/duplicate', { method: 'POST', body: {} }); return openProject(np.id); }
        if (b.id === 'del') { if (!confirm(S.delete_confirm)) return; await api('projects/' + p.id, { method: 'DELETE' }); current = null; return closeProject(); }
        if (d.jump) { var el = document.getElementById('shot-' + d.jump); if (el) el.scrollIntoView({ behavior: 'smooth' }); return; }
        if (b.id === 'add-shot') { p.shots.push(newItem({ prompt: '', seconds: 5, continuity: true })); await saveNow(); drawTab(); return; }
        if (b.id === 'add-image') { p.images.push(newItem({ prompt: '', size: '1024x1024' })); await saveNow(); drawTab(); return; }
        if (d.addAudio) { p.audio.push(newItem({ kind: d.addAudio, seconds: d.addAudio === 'song' ? 90 : 30, language: p.settings.language })); await saveNow(); drawTab(); return; }
        if (d.remove) {
          if (!confirm(S.remove_confirm)) return;
          p[d.remove] = p[d.remove].filter(function (x) { return x.id !== d.id; }); await saveNow(); drawTab(); return;
        }
        if (d.fav) {
          await flushSave();
          await api('projects/' + p.id + '/items/' + d.fav + '/favorite', { method: 'POST', body: { take: d.take || '' } });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.delTake) {
          if (!confirm(S.delete_take_confirm)) return;
          await flushSave();
          await api('projects/' + p.id + '/items/' + d.delTake + '/takes/' + d.take, { method: 'DELETE' });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.delRender) {
          if (!confirm(S.delete_render_confirm)) return;
          await api('projects/' + p.id + '/renders/' + encodeURIComponent(d.delRender), { method: 'DELETE' });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.delUpload) {
          if (!confirm(S.delete_upload_confirm)) return;
          await flushSave();
          await api('projects/' + p.id + '/uploads/' + encodeURIComponent(d.delUpload), { method: 'DELETE' });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.up || d.down) {
          var id = d.up || d.down, i = p.shots.findIndex(function (s) { return s.id === id; }), jdx = i + (d.up ? -1 : 1);
          if (jdx < 0 || jdx >= p.shots.length) return;
          var tmp = p.shots[i]; p.shots[i] = p.shots[jdx]; p.shots[jdx] = tmp; await saveNow(); drawTab(); return;
        }
        if (d.choose) { itemById(d.choose).chosen = Number(d.i); await saveNow(); drawTab(); return; }
        if (d.gen) { await saveNow(); return generate([d.gen]); }
        if (b.id === 'gen-pending') {
          await saveNow();
          var ids = p.shots.filter(function (s) { return !(s.takes || []).length && !jobFor(s.id); }).map(function (s) { return s.id; });
          if (ids.length) generate(ids);
          return;
        }
        if (d.lyrics) return lyricsDialog(d.lyrics, b);
        if (d.mv) return musicVideo(d.mv);
        if (d.rs) return retouchSong(d.rs);
        if (d.cancelJob) {
          if (!confirm(S.cancel_confirm)) return;
          await api('jobs/' + d.cancelJob, { method: 'DELETE' });
          current = await api('projects/' + p.id); loadQueue(); drawTab(); return;
        }
        if (b.id === 'cancel-all') {
          var pending = (p.jobs || []).slice();
          if (!pending.length || !confirm(fmt('cancel_all_confirm', { n: pending.length }))) return;
          // The queued ones first: stopping the running one first would let
          // the next start on the card before its own cancel arrived.
          pending.sort(function (x, y) { return (x.state === 'running') - (y.state === 'running'); });
          for (var k = 0; k < pending.length; k++) {
            try { await api('jobs/' + pending[k].id, { method: 'DELETE' }); } catch (e) { /* already finished */ }
          }
          current = await api('projects/' + p.id); loadQueue(); drawTab(); return;
        }
        if (b.id === 'preview') return previewPlayer();
        if (b.id === 'rec') return recorder();
        if (d.describe) return describeClip(d.describe, b);
        if (d.recRetry) {
          await api('projects/' + p.id + '/recordings/' + d.recRetry + '/finish', { method: 'POST' });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.copyChapters) {
          try { await navigator.clipboard.writeText(chaptersText(itemById(d.copyChapters))); toast(S.rec_desc_copied); }
          catch (e) { toast(fmt('err', { e: e.message }), true); }
          return;
        }
        if (d.transcribe || d.trim) {
          await api('projects/' + p.id + '/items/' + (d.transcribe || d.trim) + '/' + (d.transcribe ? 'transcribe' : 'trim'),
                    { method: 'POST', body: {} });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (b.id === 'ch-new') return characterDialog(null);
        if (d.chEdit) return characterDialog(cast.find(function (c) { return c.id === d.chEdit; }));
        if (d.chPortrait) {
          var rp = await api('projects/' + p.id + '/characters/' + d.chPortrait + '/portrait', { method: 'POST' });
          toast(fmt('queued_note', { n: Math.max(0, (rp.queued[0].position || 1) - 1), t: dur(rp.queued[0].starts_in || 0) }));
          loadQueue(); return;
        }
        if (d.chSpeak) {
          var who = cast.find(function (c) { return c.id === d.chSpeak; });
          var line = prompt(S.ch_speak_what, fmt('ch_speak_ph', { name: who.name })); if (!line) return;
          var rs = await api('projects/' + p.id + '/characters/' + d.chSpeak + '/speak', { method: 'POST', body: { text: line } });
          toast(fmt('queued_note', { n: Math.max(0, (rs.queued[0].position || 1) - 1), t: dur(rs.queued[0].starts_in || 0) }));
          loadQueue(); return;
        }
        if (d.chWiden) {
          if (!confirm(S.ch_widen_confirm)) return;
          await api('projects/' + p.id + '/characters/' + d.chWiden + '/widen', { method: 'POST' });
          await loadCast(); drawTab(); return;
        }
        if (d.chDel) {
          if (!confirm(S.ch_delete_confirm)) return;
          await api('projects/' + p.id + '/characters/' + d.chDel, { method: 'DELETE' });
          await loadCast(); drawTab(); return;
        }
        if (d.castToggle) {
          var sh = itemById(d.castToggle), list = (sh.cast || []).slice(), at = list.indexOf(d.ch);
          if (at >= 0) list.splice(at, 1); else list.push(d.ch);
          sh.cast = list; await saveNow(); drawTab(); return;
        }
        if (d.board || b.id === 'board-all') {
          await saveNow();
          var rb = await api('projects/' + p.id + '/storyboard', { method: 'POST', body: d.board ? { items: [d.board] } : {} });
          toast(fmt('board_queued', { n: rb.queued.length }));
          current = await api('projects/' + p.id); loadQueue(); drawTab(); return;
        }
        if (d.asRef) {
          await flushSave();
          await api('projects/' + p.id + '/references', { method: 'POST', body: { file: d.asRef, name: d.name || '', style: !!d.style } });
          toast(d.style ? S.ref_style_added : S.ref_added);
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.styleRef) {
          await api('projects/' + p.id + '/uploads/' + encodeURIComponent(d.styleRef) + '/style', { method: 'POST', body: { on: d.on === '1' } });
          toast(d.on === '1' ? S.ref_style_added : S.ref_style_removed);
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.chDescribe) {
          b.disabled = true; b.textContent = '✍️ ' + S.ch_describe_working;
          try {
            var dc = await api('char-describe', { method: 'POST', body: { project: p.id, character: d.chDescribe } });
            toast(fmt('ch_describe_done', { look: dc.look }));
          } catch (e) { toast(fmt('err', { e: e.message }), true); }
          await loadCast(); drawTab(); return;
        }
        if (d.score) {
          var st = chosen(itemById(d.score));
          if (!st || !confirm(S.score_confirm)) return;
          await flushSave();
          await api('projects/' + p.id + '/items/' + d.score + '/score', { method: 'POST', body: { take: st.id, start: true, retry: !!d.retry } });
          toast(S.score_queued);
          current = await api('projects/' + p.id); loadQueue(); drawTab(); return;
        }
        if (d.review) {
          b.disabled = true; b.textContent = '👁 ' + S.sb_reviewing;
          await flushSave();
          try { await api('board-review', { method: 'POST', body: { project: p.id, shot: d.review } }); }
          finally { current = await api('projects/' + p.id); drawTab(); }
          return;
        }
        if (b.id === 'sb-review-all') {
          // On the server, like refining with no redraws: leaving the page
          // does not stop it, and each frame shows its review as it lands.
          await flushSave();
          b.disabled = true;
          var ra = await api('board-refine', { method: 'POST', body: { project: p.id, rounds: 0, threshold: 7 } });
          toast(fmt('sb_review_started', { n: ra.started }));
          return;
        }
        if (b.id === 'sb-correct') {
          // One correction for every shot: the Designer rewrites the
          // descriptions it concerns, on the server; the changed ones are
          // saved under Alfred's name in the history, to undo in one step.
          var fb = correctDraft.trim();
          if (!fb) { toast(S.sb_correct_empty, true); return; }
          await flushSave();
          b.disabled = true; b.textContent = '✏️ ' + S.sb_correct_working;
          try {
            var rc = await api('board-correct', { method: 'POST', body: { project: p.id, feedback: fb, redraw: correctRedraw } });
            correctDraft = '';
            toast((rc.look ? fmt('sb_correct_look', { look: rc.look }) + ' ' : '') +
                  (rc.changed ? fmt('sb_correct_done', { n: rc.changed, total: rc.total }) : rc.look ? '' : S.sb_correct_none));
          } catch (e) { toast(fmt('err', { e: e.message }), true); }
          finally { current = await api('projects/' + p.id); loadQueue(); drawTab(); }
          return;
        }
        if (b.id === 'sb-refine') {
          if (!confirm(S.sb_refine_confirm)) return;
          await flushSave();
          var rf = await api('board-refine', { method: 'POST', body: { project: p.id, rounds: 2, threshold: 7 } });
          toast(fmt('sb_refine_started', { n: rf.started }));
          return;
        }
        if (d.reviewApply) {
          var sa = itemById(d.reviewApply), box = document.querySelector('textarea[data-suggest="' + sa.id + '"]');
          var text = box ? box.value.trim() : '';
          if (!text) return;
          b.disabled = true;
          sa.prompt = text; await saveNow();
          await api('projects/' + p.id + '/storyboard', { method: 'POST', body: { items: [sa.id] } });
          toast(S.sb_review_applied);
          current = await api('projects/' + p.id); loadQueue(); drawTab(); return;
        }
        if (b.id === 'fit-song') return fitToSong(b);
        if (d.sbCut) { itemById(d.sbCut).continuity = false; await saveNow(); drawTab(); return; }
        if (d.boardFrom) return boardFromDialog(d.boardFrom);
        if (b.id === 'sb-redraw-changed') {
          await saveNow();
          var ch = current.shots.filter(function (s) { return boardChanged(s) && !boardJob(s); }).map(function (s) { return s.id; });
          if (!ch.length) return;
          var rr = await api('projects/' + p.id + '/storyboard', { method: 'POST', body: { items: ch } });
          toast(fmt('board_queued', { n: rr.queued.length }));
          current = await api('projects/' + p.id); loadQueue(); drawTab(); return;
        }
        if (d.boardChoose) {
          await flushSave();
          await api('projects/' + p.id + '/items/' + d.boardChoose + '/board', { method: 'POST', body: { index: Number(d.i) } });
          current = await api('projects/' + p.id); drawTab(); return;
        }
        if (d.retouch) return retouch(d.retouch);
        if (b.id === 'long-scene') return longScene();
        if (b.id === 'render') return renderDialog();
      } catch (e) { toast(fmt('err', { e: e.message }), true); }
    });

    async function generate(ids) {
      var r = await api('projects/' + current.id + '/generate', { method: 'POST', body: { items: ids } });
      var first = r.queued[0];
      if (first) toast(fmt('queued_note', { n: Math.max(0, (first.position || 1) - 1), t: dur(first.starts_in || 0) }));
      current = await api('projects/' + current.id); await loadQueue(); drawTab();
    }
    // Asked first, always: what Alfred brings back replaces the box. With
    // lyrics already there the default is to keep them and change only what
    // the person says (or just polish them); a new song is the other choice
    // and says that it replaces them.
    function lyricsDialog(id, btn) {
      var theme = document.querySelector('[data-theme="' + id + '"]').value.trim();
      var box = document.querySelector('textarea[data-f="lyrics"][data-id="' + id + '"]');
      var has = !!(box && box.value.trim());
      themes[id] = theme;
      if (!has && !theme) { toast(S.lyrics_need_theme, true); return; }
      var dlg = $('#dlg');
      dlg.innerHTML = '<h2>' + S.write_lyrics + '</h2>' +
        (has ? '<label class="choice"><input type="radio" name="ly-mode" value="edit" checked> ' + S.lyrics_mode_edit + '</label>' +
               '<label class="choice"><input type="radio" name="ly-mode" value="new"> ' + S.lyrics_mode_new + '</label>'
             : '<p>' + fmt('lyrics_confirm_new', { theme: esc(theme) }) + '</p>') +
        '<label class="f">' + S.lyrics_notes + '</label><textarea id="ly-notes" rows="3" placeholder="' + esc(S.lyrics_notes_ph) + '"></textarea>' +
        '<div class="row" style="margin-top:12px"><span class="grow"></span><button id="ly-no">' + S.cancel + '</button><button class="primary" id="ly-go">' + S.lyrics_go + '</button></div>';
      dlg.showModal();
      $('#ly-no').onclick = function () { dlg.close(); };
      $('#ly-go').onclick = function () {
        var picked = dlg.querySelector('input[name="ly-mode"]:checked');
        var mode = picked ? picked.value : 'new';
        if (mode === 'new' && !theme) { toast(S.lyrics_need_theme, true); return; }
        var notes = $('#ly-notes').value.trim();
        dlg.close();
        writeLyrics(id, btn, mode, notes, mode === 'edit' ? box.value : '');
      };
    }
    async function writeLyrics(id, btn, mode, notes, lyrics) {
      var item = itemById(id), theme = themes[id] || '';
      btn.disabled = true; btn.textContent = S.writing_lyrics;
      busy++;
      try {
        await flushSave();

    function retouch(id) {

    function splitSeconds(total, n) {

    function musicVideo(id) {

        '<label class="f">' + S.mv_shot_len + '</label><select id="mv-len">' + [5, 8, 10, 15].map(function (v) {
          return '<option value="' + v + '"' + (v === 8 ? ' selected' : '') + '>' + v + ' ' + S.sec + '</option>'; }).join('') + '</select>' +
        (refs.length ? '<label class="f">' + S.mv_ref + '</label><select id="mv-ref"><option value="">' + S.none + '</option>' +

      dlg.showModal();

    // A new version of a song from the one shown. "A part": its lines, each

    function retouchSong(id) {

        '<label class="row" style="font-size:.86rem;margin-top:8px"><input type="checkbox" id="rs-v" style="width:auto" checked> ' + S.rs_keep_voice + '</label></div>' +

    // Recording yourself: the screen, the camera, or both -- the camera in a

    // stopping asks the Studio to join them into a clip of the project.
    function recorder() {

        '<div class="row"><label class="row" style="font-size:.9rem"><input type="checkbox" id="rc-screen" style="width:auto"' + (canScreen ? ' checked' : ' disabled') + '> ' + S.rec_screen + '</label>' +
        '<label class="row" style="font-size:.9rem"><input type="checkbox" id="rc-cam" style="width:auto" checked> ' + S.rec_cam + '</label>' +
        '<label class="row" style="font-size:.9rem"><input type="checkbox" id="rc-mic" style="width:auto" checked> ' + S.rec_mic + '</label></div>' +
        (canScreen ? '' : '<p class="muted">' + S.rec_no_screen + '</p>') +
        '<video id="rc-view" muted playsinline autoplay style="width:100%;background:#000;border-radius:8px;margin-top:8px"></video>' +
        '<div class="row" style="margin-top:10px"><button class="primary" id="rc-start">' + S.rec_start + '</button>' +
        '<button id="rc-pause" hidden>' + S.rec_pause + '</button><button class="danger" id="rc-stop" hidden>' + S.rec_stop + '</button>' +

      }
      function send(blob) {

            try {
              var r = await fetch('/studio/api/projects/' + p.id + '/recordings/' + st.rid + '/chunk?n=' + n, {

            await new Promise(function (ok) { setTimeout(ok, 2000 * (attempt + 1)); });
          }
          toast(fmt('err', { e: 'piece ' + n }), true);
        });
      }
      $('#rc-no').onclick = function () { if (st.rec && st.rec.state !== 'inactive') st.rec.stop(); release(); dlg.close(); };
      $('#rc-start').onclick = async function () {
        var wantScreen = $('#rc-screen').checked, wantCam = $('#rc-cam').checked, wantMic = $('#rc-mic').checked;

        try {
          if (wantScreen) { screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: false }); st.streams.push(screen); }
          if (wantCam) { cam = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }); st.streams.push(cam); }
          if (wantMic) { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); st.streams.push(mic); }

          // crawl while the person is in the window being recorded.

          catch (e) { toast(fmt('err', { e: e.message }), true); }

      };
      $('#rc-pause').onclick = function () {
        if (st.rec.state === 'recording') { st.rec.pause(); st.pauseAt = Date.now(); this.textContent = S.rec_resume; }
        else { st.rec.resume(); st.paused += Date.now() - st.pauseAt; st.pauseAt = 0; this.textContent = S.rec_pause; }
      };
      $('#rc-stop').onclick = function () { if (st.rec && st.rec.state !== 'inactive') st.rec.stop(); };
    }

    // The video as it stands, in the browser: each chosen take in order, a
    // card for the ones not made yet, and the soundtrack underneath, moved to
    // where each shot starts so the two stay together. Nothing is rendered.
    function previewPlayer() {
      var p = current, dlg = $('#dlg');
      var tracks = (p.audio || []).filter(function (a) { return chosen(a) && chosen(a).file; });
      var st = (p.settings || {}).soundtrack || (tracks[0] && tracks[0].id) || '';
      var segs = [], at = 0;
      (p.shots || []).forEach(function (s, i) {
        var t = chosen(s), len = s.exact ? +s.seconds : ((t && t.seconds) || s.seconds || 5);
        var bd = chosenBoard(s);
        segs.push({ n: i + 1, file: t && t.file ? fileUrl(p.id, t.file) : '', board: bd ? fileUrl(p.id, bd.file) : '',
                    prompt: s.prompt || '', start: at, len: len });
        at += len;
      });
      dlg.classList.add('wide');
      dlg.addEventListener('close', function () { dlg.classList.remove('wide'); }, { once: true });
      dlg.innerHTML = '<h2>▶ ' + S.preview + '</h2>' +
        '<div id="pv-stage" style="position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden">' +
        '<video id="pv-v" playsinline style="width:100%;height:100%;object-fit:contain"></video>' +
        '<div id="pv-card" style="position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:16px;color:#eee;font-size:.9rem;background:#222"></div></div>' +
        '<div class="row" style="margin-top:8px"><span id="pv-at" class="muted"></span><span class="grow"></span>' +
        (tracks.length ? '<label class="f" style="margin:0">' + S.soundtrack + '</label><select id="pv-a" style="width:auto"><option value="">' + S.none + '</option>' +
          tracks.map(function (a) { return '<option value="' + a.id + '"' + (a.id === st ? ' selected' : '') + '>' + esc(a.title || S['kind_' + (a.kind || 'song')]) + '</option>'; }).join('') + '</select>' : '') +
        '</div><label class="row" style="font-size:.86rem"><input type="checkbox" id="pv-m" style="width:auto"' + (st ? ' checked' : '') + '> ' + S.mute_shots + '</label>' +
        '<div class="row" style="margin-top:12px"><button id="pv-play" class="primary">▶</button><span class="grow"></span>' +
        '<button id="pv-dl">⬇ ' + S.preview_download + '</button><button id="pv-no">' + S.preview_close + '</button></div>';
      dlg.showModal();
      var v = $('#pv-v'), card = $('#pv-card'), audio = new Audio(), idx = 0, timer = null, playing = false;
      function song() { var sel = $('#pv-a'); var a = sel && sel.value ? itemById(sel.value) : null; return a ? fileUrl(p.id, chosen(a).file) : ''; }
      function stop() { playing = false; clearTimeout(timer); v.pause(); audio.pause(); $('#pv-play').textContent = '▶'; }
      function show(i) {
        clearTimeout(timer);
        if (i >= segs.length) { stop(); idx = 0; return; }
        idx = i; var seg = segs[i];
        $('#pv-at').textContent = S.shot + ' ' + seg.n + ' / ' + segs.length + ' · ' + Math.floor(seg.start) + ' s';
        var src = song();
        if (src) {
          if (audio.src.indexOf(src) < 0) audio.src = src;
          if (Math.abs(audio.currentTime - seg.start) > 0.3) audio.currentTime = seg.start;
          audio.play().catch(function () {});
        }
        if (seg.file) {
          // style.display, not `hidden`: the card's own inline `display` beat
          // the attribute, and it covered every shot (2026-09-28).
          card.style.display = 'none'; v.style.visibility = 'visible'; v.muted = $('#pv-m').checked;
          v.src = seg.file; v.play().catch(function () {});
          v.onended = function () { if (playing) show(idx + 1); };
          // A shot made long for its cut is shown only up to the cut.
          v.ontimeupdate = function () { if (playing && v.currentTime >= seg.len - 0.02) { v.ontimeupdate = null; show(idx + 1); } };
        } else {
          v.pause(); v.style.visibility = 'hidden'; card.style.display = 'flex';
          card.innerHTML = seg.board
            ? '<img src="' + seg.board + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">' +
              '<span class="pill" style="position:absolute;left:8px;top:8px">🖼️ ' + S.storyboard + ' · ' + S.shot + ' ' + seg.n + '</span>'
            : '<b>' + S.shot + ' ' + seg.n + ' · ' + S.preview_missing + '</b><p style="margin-top:8px">' + esc(seg.prompt) + '</p>';
          timer = setTimeout(function () { if (playing) show(idx + 1); }, seg.len * 1000);
        }
      }
      $('#pv-play').onclick = function () {
        if (playing) return stop();
        playing = true; this.textContent = '⏸'; show(idx);
      };
      $('#pv-m').onchange = function () { v.muted = this.checked; };
      // The same video as a file: every shot in place -- the ones not made
      // yet as a card -- with the song under it, and a preview watermark
      // saying which shot, where in the song and which version each is.
      $('#pv-dl').onclick = async function () {
        var b = this, sel = $('#pv-a');
        var songs = sel && sel.value ? [{ item: sel.value, volume: 1, start: 0 }] : [];
        b.disabled = true; b.textContent = S.preview_rendering;
        try {
          await api('projects/' + p.id + '/render', { method: 'POST', body: {
            preview: true, crossfade: 0, tracks: songs, own_sound: !($('#pv-m').checked && songs.length),
            labels: { preview: S.preview, shot: S.shot, missing: S.preview_missing, version: S.take } } });
          var r = null;
          for (var i = 0; i < 600; i++) {
            await new Promise(function (ok) { setTimeout(ok, 3000); });
            r = (await api('projects/' + p.id)).render;
            if (!r || r.state !== 'running') break;
          }
          if (r && r.state === 'done') {
            await saveFile(fileUrl(p.id, r.file) + '?download=' + encodeURIComponent(p.name + ' - ' + S.preview),
                           p.name + ' - ' + S.preview + '.mp4');
          } else toast(S.render_failed + (r && r.error ? ': ' + r.error : ''), true);
        } catch (e) { toast(fmt('err', { e: e.message }), true); }
        finally { b.disabled = false; b.textContent = '⬇ ' + S.preview_download; }
      };
      $('#pv-no').onclick = function () { stop(); dlg.close(); };
      dlg.addEventListener('close', stop, { once: true });
    }

    function renderDialog() {
      var p = current, dlg = $('#dlg'), audio = (p.audio || []).filter(function (a) { return (a.takes || []).length; });
      var soundtrack = (p.settings || {}).soundtrack || '';
      dlg.innerHTML = '<h2>' + S.render + '</h2>' +
        '<label class="row" style="font-size:.86rem"><input type="checkbox" id="rd-x" style="width:auto"> ' + S.render_crossfade + '</label>' +
        ((p.shots || []).some(function (s) { return ((chosen(s) || {}).transcript || {}).state === 'done'; })
          ? '<label class="row" style="font-size:.86rem"><input type="checkbox" id="rd-subs" style="width:auto" checked> ' + S.render_subs + '</label>' : '') +
        (audio.length ? '<label class="f">' + S.render_music + '</label><select id="rd-a"><option value="">' + S.none + '</option>' +
          audio.map(function (a) { return '<option value="' + a.id + '"' + (a.id === soundtrack ? ' selected' : '') + '>' + esc(a.title || S['kind_' + (a.kind || 'song')]) + '</option>'; }).join('') + '</select>' +
          '<div class="row"><div class="grow"><label class="f">' + S.render_volume + '</label><input type="range" id="rd-v" min="0" max="150" value="' + (soundtrack ? 100 : 80) + '"></div>' +
          '<div class="grow"><label class="f">' + S.render_start + '</label><input type="number" id="rd-t" min="0" value="0"></div></div>' +
          '<label class="row" style="font-size:.86rem"><input type="checkbox" id="rd-m" style="width:auto"' + (soundtrack ? ' checked' : '') + '> ' + S.mute_shots + '</label>' : '') +
        '<div class="row" style="margin-top:12px"><span class="grow"></span><button id="rd-no">' + S.cancel + '</button><button class="primary" id="rd-go">' + S.render_go + '</button></div>';
      dlg.showModal();
      $('#rd-no').onclick = function () { dlg.close(); };
      $('#rd-go').onclick = async function () {
        var tracks = [], a = $('#rd-a');
        if (a && a.value) tracks.push({ item: a.value, volume: $('#rd-v').value / 100, start: Number($('#rd-t').value) || 0 });
        try {
          var mute = $('#rd-m');
          await api('projects/' + p.id + '/render', { method: 'POST', body: { crossfade: $('#rd-x').checked ? 0.5 : 0, tracks: tracks,
                                                                              subtitles: !!($('#rd-subs') && $('#rd-subs').checked),
                                                                              own_sound: !(mute && mute.checked && tracks.length) } });
          dlg.close(); current = await api('projects/' + p.id); drawTab(); watchRender();
        } catch (e) { toast(fmt('err', { e: e.message }), true); }
      };
    }
    function watchRender() {
      var t = setInterval(async function () {
        if (!current) return clearInterval(t);
        var p = await api('projects/' + current.id);
        if (!p.render || p.render.state !== 'running') { clearInterval(t); current = p; if (!dirty) drawTab(); }
      }, 4000);
    }

    // What changed while the page was open: a job finished, a take arrived.
    var lastSig = '';
    async function syncJobs() {
      if (!current || dirty || saving || busy || document.querySelector('dialog[open]')) return;
      var active = document.activeElement;
      var p = await api('projects/' + current.id);
      var sig = JSON.stringify([p.jobs.map(function (j) { return [j.id, j.state, Math.round(j.progress * 20), !!j.preview]; }),
        // Work done beside the queue (a transcript, a trim, a recording being
        // encoded) has no job to watch, so its state is part of what is
        // compared -- the tab redraws when it finishes, under the same guards.
        ['shots', 'audio', 'images'].map(function (k) { return p[k].map(function (i) {
          return [(i.takes || []).length, (i.boards || []).length, (i.trim || {}).state, (i.recording || {}).state,
                  ((chosen(i) || {}).transcript || {}).state, ((chosen(i) || {}).score || {}).state,
                  (((chosenBoard(i) || {}).review) || {}).state, (((chosenBoard(i) || {}).review) || {}).score].join(':'); }); })]);
      if (sig !== lastSig) {
        lastSig = sig;
        // Never redraw under somebody's cursor: the new takes wait for the
        // next change of focus.
        if (active && /INPUT|TEXTAREA|SELECT/.test(active.tagName) && active.closest('#v-edit')) { current.jobs = p.jobs; lastSig = ''; return; }
        var y = window.scrollY; current = p; drawTab(); window.scrollTo(0, y);
      }
    }

    // ── Start ─────────────────────────────────────────────────────────────
    loadList();
    loadQueue();
    setInterval(loadQueue, 5000);
    // The in-progress pictures change under the same URL; fetched again only
    // while the page is looked at.
    setInterval(function () {
      if (document.hidden) return;
      document.querySelectorAll('img.live').forEach(function (img) { img.src = img.dataset.src + '?t=' + Date.now(); });
    }, 4000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) loadQueue(); });
    window.addEventListener('beforeunload', flushSave);
    var want = new URLSearchParams(location.search).get('project');
    if (want) openProject(want).catch(function () { history.replaceState(null, '', '/studio'); });
  })();
  </script>
</body>
</html>
