        if (screen) screen.getVideoTracks()[0].onended = function () { if (st.rec && st.rec.state !== 'inactive') $('#rc-stop').click(); };
        var tracks = [video].concat(mic ? mic.getAudioTracks() : []);
        var out = new MediaStream(tracks);
        $('#rc-view').srcObject = out;
        var type = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(function (t) {
          return window.MediaRecorder && MediaRecorder.isTypeSupported(t); });
        try {
          var n = (p.shots || []).filter(function (x) { return x.recorded; }).length + 1;
          st.rid = (await api('projects/' + p.id + '/recordings', { method: 'POST', body: { title: fmt('rec_default_title', { n: n }) } })).id;
          st.rec = new MediaRecorder(out, { mimeType: type, videoBitsPerSecond: 2500000 });
        } catch (e) { release(); toast(fmt('err', { e: e.message }), true); return; }
        st.rec.ondataavailable = function (e) { if (e.data && e.data.size) send(e.data); };
        st.rec.onstop = async function () {
          $('#rc-stop').disabled = true; $('#rc-pause').hidden = true;
          await st.queue;
          try { await api('projects/' + p.id + '/recordings/' + st.rid + '/finish', { method: 'POST' }); }
          catch (e) { toast(fmt('err', { e: e.message }), true); }
          release(); dlg.close();
          current = await api('projects/' + p.id); drawTab(); watchClips();
        };
        st.rec.start(5000);
        st.t0 = Date.now(); st.clock = setInterval(clockNow, 500);
        $('#rc-start').hidden = true; $('#rc-pause').hidden = false; $('#rc-stop').hidden = false; $('#rc-no').hidden = true;
        ['rc-screen', 'rc-cam', 'rc-mic'].forEach(function (id) { $('#' + id).disabled = true; });
      };
      $('#rc-pause').onclick = function () {
        if (st.rec.state === 'recording') { st.rec.pause(); st.pauseAt = Date.now(); this.textContent = S.rec_resume; }
        else { st.rec.resume(); st.paused += Date.now() - st.pauseAt; st.pauseAt = 0; this.textContent = S.rec_pause; }
      };
      $('#rc-stop').onclick = function () { if (st.rec && st.rec.state !== 'inactive') st.rec.stop(); };
    }

    // The video as it stands, in the browser: each chosen take in order, a
    // card for the ones not made yet, and the soundtrack underneath, moved to
    // where each shot starts so the two stay together. Nothing is rendered.
    function previewPlayer() {
      var p = current, dlg = $('#dlg');
      var tracks = (p.audio || []).filter(function (a) { return chosen(a) && chosen(a).file; });
      var st = (p.settings || {}).soundtrack || (tracks[0] && tracks[0].id) || '';
      var segs = [], at = 0;
      (p.shots || []).forEach(function (s, i) {
        var t = chosen(s), len = s.exact ? +s.seconds : ((t && t.seconds) || s.seconds || 5);
        var bd = chosenBoard(s);
        segs.push({ n: i + 1, file: t && t.file ? fileUrl(p.id, t.file) : '', board: bd ? fileUrl(p.id, bd.file) : '',
                    prompt: s.prompt || '', start: at, len: len });
        at += len;
      });
      dlg.classList.add('wide');
      dlg.addEventListener('close', function () { dlg.classList.remove('wide'); }, { once: true });
      dlg.innerHTML = '<h2>▶ ' + S.preview + '</h2>' +
        '<div id="pv-stage" style="position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden">' +
        '<video id="pv-v" playsinline style="width:100%;height:100%;object-fit:contain"></video>' +
        '<div id="pv-card" style="position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:16px;color:#eee;font-size:.9rem;background:#222"></div></div>' +
        '<div class="row" style="margin-top:8px"><span id="pv-at" class="muted"></span><span class="grow"></span>' +
        (tracks.length ? '<label class="f" style="margin:0">' + S.soundtrack + '</label><select id="pv-a" style="width:auto"><option value="">' + S.none + '</option>' +
          tracks.map(function (a) { return '<option value="' + a.id + '"' + (a.id === st ? ' selected' : '') + '>' + esc(a.title || S['kind_' + (a.kind || 'song')]) + '</option>'; }).join('') + '</select>' : '') +
        '</div><label class="row" style="font-size:.86rem"><input type="checkbox" id="pv-m" style="width:auto"' + (st ? ' checked' : '') + '> ' + S.mute_shots + '</label>' +
        '<div class="row" style="margin-top:12px"><button id="pv-play" class="primary">▶</button><span class="grow"></span>' +
        '<button id="pv-dl">⬇ ' + S.preview_download + '</button><button id="pv-no">' + S.preview_close + '</button></div>';
      dlg.showModal();
      var v = $('#pv-v'), card = $('#pv-card'), audio = new Audio(), idx = 0, timer = null, playing = false;
      function song() { var sel = $('#pv-a'); var a = sel && sel.value ? itemById(sel.value) : null; return a ? fileUrl(p.id, chosen(a).file) : ''; }
      function stop() { playing = false; clearTimeout(timer); v.pause(); audio.pause(); $('#pv-play').textContent = '▶'; }
      function show(i) {
        clearTimeout(timer);
        if (i >= segs.length) { stop(); idx = 0; return; }
        idx = i; var seg = segs[i];
        $('#pv-at').textContent = S.shot + ' ' + seg.n + ' / ' + segs.length + ' · ' + Math.floor(seg.start) + ' s';
        var src = song();
        if (src) {
          if (audio.src.indexOf(src) < 0) audio.src = src;
          if (Math.abs(audio.currentTime - seg.start) > 0.3) audio.currentTime = seg.start;
          audio.play().catch(function () {});
        }
        if (seg.file) {
          // style.display, not `hidden`: the card's own inline `display` beat
          // the attribute, and it covered every shot (2026-09-28).
          card.style.display = 'none'; v.style.visibility = 'visible'; v.muted = $('#pv-m').checked;
          v.src = seg.file; v.play().catch(function () {});
          v.onended = function () { if (playing) show(idx + 1); };
          // A shot made long for its cut is shown only up to the cut.
          v.ontimeupdate = function () { if (playing && v.currentTime >= seg.len - 0.02) { v.ontimeupdate = null; show(idx + 1); } };
        } else {
          v.pause(); v.style.visibility = 'hidden'; card.style.display = 'flex';
          card.innerHTML = seg.board
            ? '<img src="' + seg.board + '" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">' +
              '<span class="pill" style="position:absolute;left:8px;top:8px">🖼️ ' + S.storyboard + ' · ' + S.shot + ' ' + seg.n + '</span>'
            : '<b>' + S.shot + ' ' + seg.n + ' · ' + S.preview_missing + '</b><p style="margin-top:8px">' + esc(seg.prompt) + '</p>';
          timer = setTimeout(function () { if (playing) show(idx + 1); }, seg.len * 1000);
        }
      }
      $('#pv-play').onclick = function () {
        if (playing) return stop();
        playing = true; this.textContent = '⏸'; show(idx);
      };
      $('#pv-m').onchange = function () { v.muted = this.checked; };
      // The same video as a file: every shot in place -- the ones not made
      // yet as a card -- with the song under it, and a preview watermark
      // saying which shot, where in the song and which version each is.
      $('#pv-dl').onclick = async function () {
        var b = this, sel = $('#pv-a');
        var songs = sel && sel.value ? [{ item: sel.value, volume: 1, start: 0 }] : [];
        b.disabled = true; b.textContent = S.preview_rendering;
        try {
          await api('projects/' + p.id + '/render', { method: 'POST', body: {
            preview: true, crossfade: 0, tracks: songs, own_sound: !($('#pv-m').checked && songs.length),
            labels: { preview: S.preview, shot: S.shot, missing: S.preview_missing, version: S.take } } });
          var r = null;
          for (var i = 0; i < 600; i++) {
            await new Promise(function (ok) { setTimeout(ok, 3000); });
            r = (await api('projects/' + p.id)).render;
            if (!r || r.state !== 'running') break;
          }
          if (r && r.state === 'done') {
            await saveFile(fileUrl(p.id, r.file) + '?download=' + encodeURIComponent(p.name + ' - ' + S.preview),
                           p.name + ' - ' + S.preview + '.mp4');
          } else toast(S.render_failed + (r && r.error ? ': ' + r.error : ''), true);
        } catch (e) { toast(fmt('err', { e: e.message }), true); }
        finally { b.disabled = false; b.textContent = '⬇ ' + S.preview_download; }
      };
      $('#pv-no').onclick = function () { stop(); dlg.close(); };
      dlg.addEventListener('close', stop, { once: true });
    }

    function renderDialog() {
      var p = current, dlg = $('#dlg'), audio = (p.audio || []).filter(function (a) { return (a.takes || []).length; });
      var soundtrack = (p.settings || {}).soundtrack || '';
      dlg.innerHTML = '<h2>' + S.render + '</h2>' +
        '<label class="row" style="font-size:.86rem"><input type="checkbox" id="rd-x" style="width:auto"> ' + S.render_crossfade + '</label>' +
        ((p.shots || []).some(function (s) { return ((chosen(s) || {}).transcript || {}).state === 'done'; })
          ? '<label class="row" style="font-size:.86rem"><input type="checkbox" id="rd-subs" style="width:auto" checked> ' + S.render_subs + '</label>' : '') +
        (audio.length ? '<label class="f">' + S.render_music + '</label><select id="rd-a"><option value="">' + S.none + '</option>' +
          audio.map(function (a) { return '<option value="' + a.id + '"' + (a.id === soundtrack ? ' selected' : '') + '>' + esc(a.title || S['kind_' + (a.kind || 'song')]) + '</option>'; }).join('') + '</select>' +
          '<div class="row"><div class="grow"><label class="f">' + S.render_volume + '</label><input type="range" id="rd-v" min="0" max="150" value="' + (soundtrack ? 100 : 80) + '"></div>' +
          '<div class="grow"><label class="f">' + S.render_start + '</label><input type="number" id="rd-t" min="0" value="0"></div></div>' +
          '<label class="row" style="font-size:.86rem"><input type="checkbox" id="rd-m" style="width:auto"' + (soundtrack ? ' checked' : '') + '> ' + S.mute_shots + '</label>' : '') +
        '<div class="row" style="margin-top:12px"><span class="grow"></span><button id="rd-no">' + S.cancel + '</button><button class="primary" id="rd-go">' + S.render_go + '</button></div>';
      dlg.showModal();
      $('#rd-no').onclick = function () { dlg.close(); };
      $('#rd-go').onclick = async function () {
        var tracks = [], a = $('#rd-a');
        if (a && a.value) tracks.push({ item: a.value, volume: $('#rd-v').value / 100, start: Number($('#rd-t').value) || 0 });
        try {
          var mute = $('#rd-m');
          await api('projects/' + p.id + '/render', { method: 'POST', body: { crossfade: $('#rd-x').checked ? 0.5 : 0, tracks: tracks,
                                                                              subtitles: !!($('#rd-subs') && $('#rd-subs').checked),
                                                                              own_sound: !(mute && mute.checked && tracks.length) } });
          dlg.close(); current = await api('projects/' + p.id); drawTab(); watchRender();
        } catch (e) { toast(fmt('err', { e: e.message }), true); }
      };
    }
    // A clip being transcribed or trimmed is worked on beside the queue, so
    // no job says when it is done: the page asks until the clip does.
    function watchClips() {
      var t = setInterval(async function () {
        if (!current) return clearInterval(t);
        var p = await api('projects/' + current.id);
        var busy = (p.shots || []).some(function (s) {
          var tk = chosen(s) || {};
          return (s.trim || {}).state === 'running' || (tk.transcript || {}).state === 'running' || (s.recording || {}).state === 'processing';
        });
        if (!busy) { clearInterval(t); }
        if (!dirty && !document.querySelector('dialog[open]')) { current = p; drawTab(); }
      }, 4000);
    }
    function watchRender() {
      var t = setInterval(async function () {
        if (!current) return clearInterval(t);
        var p = await api('projects/' + current.id);
        if (!p.render || p.render.state !== 'running') { clearInterval(t); current = p; if (!dirty) drawTab(); }
      }, 4000);
    }

    // What changed while the page was open: a job finished, a take arrived.
    var lastSig = '';
    async function syncJobs() {
      if (!current || dirty || saving || busy || document.querySelector('dialog[open]')) return;
      var active = document.activeElement;
      var p = await api('projects/' + current.id);
      var sig = JSON.stringify([p.jobs.map(function (j) { return [j.id, j.state, Math.round(j.progress * 20), !!j.preview]; }),
        ['shots', 'audio', 'images'].map(function (k) { return p[k].map(function (i) { return (i.takes || []).length + ':' + (i.boards || []).length; }); })]);
      if (sig !== lastSig) {
        lastSig = sig;
        // Never redraw under somebody's cursor: the new takes wait for the
        // next change of focus.
        if (active && /INPUT|TEXTAREA|SELECT/.test(active.tagName) && active.closest('#v-edit')) { current.jobs = p.jobs; lastSig = ''; return; }
        var y = window.scrollY; current = p; drawTab(); window.scrollTo(0, y);
      }
    }

    // ── Start ─────────────────────────────────────────────────────────────
    loadList();
    loadQueue();
    setInterval(loadQueue, 5000);
    // The in-progress pictures change under the same URL; fetched again only
    // while the page is looked at.
    setInterval(function () {
      if (document.hidden) return;
      document.querySelectorAll('img.live').forEach(function (img) { img.src = img.dataset.src + '?t=' + Date.now(); });
    }, 4000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) loadQueue(); });
    window.addEventListener('beforeunload', flushSave);
    var want = new URLSearchParams(location.search).get('project');
    if (want) openProject(want).catch(function () { history.replaceState(null, '', '/studio'); });
  })();
  </script>
</body>
</html>
